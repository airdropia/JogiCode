name: build-windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  RUST_VERSION: stable
  NODE_VERSION: 22
  PNPM_VERSION: 9.12.0
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  # Pin code-server version for reproducible builds.
  # Note: npm 'code-server' package lags behind GitHub releases.
  # Latest on npm as of 2026-07: 4.117.0
  CODE_SERVER_VERSION: "4.117.0"

jobs:
  build:
    name: Build JogiCode (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare code-server sidecar (Node.js portable + code-server npm)
        shell: bash
        run: |
          set -euo pipefail

          # ────────────────────────────────────────────────────────────────
          # code-server does not publish a Windows standalone binary.
          # We bundle:
          #   1. Node.js portable Windows x64 binary (node.exe)
          #   2. code-server npm package (installed into binaries/code-server/)
          # Rust spawns: node.exe binaries/code-server/out/node/entry.js --bind-addr ...
          # ────────────────────────────────────────────────────────────────

          SIDECAR_DIR="src-tauri/binaries"
          mkdir -p "$SIDECAR_DIR"

          # ── 1. Download Node.js portable Windows x64 ──
          # Get the Node.js version that matches our setup-node (v22.x)
          NODE_VER=$(node --version)
          echo "Using Node.js $NODE_VER"

          # Download the Node.js Windows x64 zip from nodejs.org
          NODE_URL="https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-win-x64.zip"
          echo "Downloading Node.js portable from: $NODE_URL"

          curl -sL "$NODE_URL" -o /tmp/node.zip
          if [ ! -s /tmp/node.zip ]; then
            echo "ERROR: Node.js download failed"
            exit 1
          fi

          # Extract just node.exe from the zip
          unzip -j /tmp/node.zip "node-${NODE_VER}-win-x64/node.exe" -d "$SIDECAR_DIR/"
          echo "node.exe extracted to $SIDECAR_DIR/"
          ls -la "$SIDECAR_DIR/node.exe"
          rm -f /tmp/node.zip

          # ── 2. Install code-server npm package ──
          # IMPORTANT: Do NOT use --ignore-scripts. code-server's postinstall
          # script runs `cd lib/vscode && npm install` which installs VS Code's
          # dependencies (like @microsoft/1ds-core-js) into lib/vscode/node_modules/.
          # Without these, code-server crashes with ERR_MODULE_NOT_FOUND at runtime.
          echo "Installing code-server@${{ env.CODE_SERVER_VERSION }} (with postinstall scripts)..."
          mkdir -p "$SIDECAR_DIR/code-server"
          cd "$SIDECAR_DIR/code-server"

          # Create a minimal package.json and install code-server locally.
          # Using --no-package-lock to avoid committing the lockfile, but
          # NOT using --ignore-scripts so postinstall runs.
          npm init -y > /dev/null 2>&1
          npm install "code-server@${{ env.CODE_SERVER_VERSION }}" --no-package-lock 2>&1 | tail -20

          cd - > /dev/null

          # Verify the entry point exists
          ENTRY="$SIDECAR_DIR/code-server/node_modules/code-server/out/node/entry.js"
          if [ ! -f "$ENTRY" ]; then
            echo "ERROR: code-server entry.js not found at $ENTRY"
            echo "Listing code-server dir:"
            find "$SIDECAR_DIR/code-server" -name "entry.js" 2>/dev/null | head -5
            exit 1
          fi

          # Verify VS Code dependencies were installed by postinstall
          VSCODE_DEPS="$SIDECAR_DIR/code-server/node_modules/code-server/lib/vscode/node_modules"
          if [ -d "$VSCODE_DEPS" ]; then
            echo "VS Code dependencies installed at: $VSCODE_DEPS"
            ls "$VSCODE_DEPS" | head -10
          else
            echo "WARNING: VS Code node_modules not found — code-server may crash at runtime"
            echo "Checking if @microsoft/1ds-core-js exists anywhere:"
            find "$SIDECAR_DIR/code-server" -name "1ds-core-js" -type d 2>/dev/null | head -5
          fi

          echo "code-server entry.js verified at: $ENTRY"
          echo ""

          # ── 3. Summary ──
          echo "=== Sidecar contents ==="
          find "$SIDECAR_DIR" -maxdepth 2 -type f | head -20
          echo "..."
          echo "Total sidecar size: $(du -sh "$SIDECAR_DIR" | cut -f1)"

      - name: Ensure icons are valid RGBA
        shell: bash
        run: |
          # Install Pillow for icon generation from source jogicode.png
          pip install Pillow --quiet 2>&1 | tail -1 || true
          python3 src-tauri/scripts/make_icons.py
          for f in src-tauri/icons/*.png; do
            ct=$(python3 -c "
          import struct
          d=open('$f','rb').read()
          assert d[:8]==b'\x89PNG\r\n\x1a\n','not a PNG'
          print(struct.unpack('>IIBB', d[16:16+10])[3])
          ")
            if [ "$ct" != "6" ]; then
              echo "ERROR: $f has color_type=$ct (must be 6=RGBA)"
              exit 1
            fi
          done
          echo "All icons are valid RGBA."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --ignore-scripts

      - name: Build JogiCode (Tauri NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('JogiCode {0}', github.ref_name) || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/v') && format('JogiCode {0} — Lightweight Windows IDE powered by code-server.', github.ref_name) || '' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: false
          args: --target ${{ env.WINDOWS_TARGET }}

      - name: Upload JogiCode installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JogiCode-windows-x64-installer
          path: |
            src-tauri/target/${{ env.WINDOWS_TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
