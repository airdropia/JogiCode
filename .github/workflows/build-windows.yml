name: build-windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  RUST_VERSION: stable
  NODE_VERSION: 22
  PNPM_VERSION: 9.12.0
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  # Pin code-server version for reproducible builds.
  # Note: npm 'code-server' package lags behind GitHub releases.
  # Latest on npm as of 2026-07: 4.117.0
  CODE_SERVER_VERSION: "4.117.0"
  # Tell node-gyp to use Visual Studio 2022 (pre-installed on windows-latest).
  # Without this, node-gyp fails with "Could not find any Visual Studio
  # installation to use" even though VS 2022 Enterprise is on the runner.
  GYP_MSVS_VERSION: "2022"

jobs:
  build:
    name: Build JogiCode (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare code-server sidecar (Node.js portable + code-server npm)
        shell: bash
        run: |
          set -euo pipefail

          # ────────────────────────────────────────────────────────────────
          # code-server does not publish a Windows standalone binary.
          # We bundle:
          #   1. Node.js portable Windows x64 binary (node.exe)
          #   2. code-server npm package (installed into binaries/code-server/)
          # Rust spawns: node.exe binaries/code-server/out/node/entry.js --bind-addr ...
          # ────────────────────────────────────────────────────────────────

          SIDECAR_DIR="src-tauri/binaries"
          mkdir -p "$SIDECAR_DIR"

          # ── 1. Download Node.js portable Windows x64 ──
          # Get the Node.js version that matches our setup-node (v22.x)
          NODE_VER=$(node --version)
          echo "Using Node.js $NODE_VER"

          # Download the Node.js Windows x64 zip from nodejs.org
          NODE_URL="https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-win-x64.zip"
          echo "Downloading Node.js portable from: $NODE_URL"

          curl -sL "$NODE_URL" -o /tmp/node.zip
          if [ ! -s /tmp/node.zip ]; then
            echo "ERROR: Node.js download failed"
            exit 1
          fi

          # Extract just node.exe from the zip
          unzip -j /tmp/node.zip "node-${NODE_VER}-win-x64/node.exe" -d "$SIDECAR_DIR/"
          echo "node.exe extracted to $SIDECAR_DIR/"
          ls -la "$SIDECAR_DIR/node.exe"
          rm -f /tmp/node.zip

          # ── 2. Install code-server npm package ──
          # Strategy:
          #   a) Install code-server top-level with --ignore-scripts (fast extraction)
          #   b) Install VS Code deps in lib/vscode/ WITHOUT --ignore-scripts
          #      so native modules (@vscode/spdlog, @vscode/deviceid,
          #      @vscode/windows-registry) get compiled via node-gyp.
          #   c) Set GYP_MSVS_VERSION=2022 so node-gyp finds the VS 2022
          #      Build Tools that are pre-installed on windows-latest.
          echo "Installing code-server@${{ env.CODE_SERVER_VERSION }}..."
          mkdir -p "$SIDECAR_DIR/code-server"
          cd "$SIDECAR_DIR/code-server"

          npm init -y > /dev/null 2>&1
          # Top-level install WITH --ignore-scripts (just extracts files,
          # no native compilation needed at this level).
          npm install "code-server@${{ env.CODE_SERVER_VERSION }}" --no-save --no-package-lock --ignore-scripts 2>&1 | tail -5

          cd - > /dev/null

          # Verify the entry point exists
          ENTRY="$SIDECAR_DIR/code-server/node_modules/code-server/out/node/entry.js"
          if [ ! -f "$ENTRY" ]; then
            echo "ERROR: code-server entry.js not found at $ENTRY"
            find "$SIDECAR_DIR/code-server" -name "entry.js" 2>/dev/null | head -5
            exit 1
          fi

          # ── 3. Install VS Code dependencies WITH native module compilation ──
          # This is the critical step: we must NOT use --ignore-scripts here
          # because VS Code has native C++ modules that must be compiled:
          #   - @vscode/spdlog (spdlog.node — fast logging)
          #   - @vscode/deviceid (windows.node — device identification)
          #   - @vscode/windows-registry (winregistry.node — registry access)
          # Without these .node binaries, code-server crashes with 500 errors.
          #
          # The windows-latest runner has Visual Studio 2022 Enterprise
          # pre-installed. We set GYP_MSVS_VERSION=2022 so node-gyp finds it.
          VSCODE_DIR="$SIDECAR_DIR/code-server/node_modules/code-server/lib/vscode"
          echo "Installing VS Code dependencies (WITH native module compilation)..."
          echo "GYP_MSVS_VERSION=$GYP_MSVS_VERSION"

          # GYP_MSVS_VERSION=2022 is set in the workflow env block above.
          # node-gyp reads this env var to find Visual Studio 2022.
          # (Don't use 'npm config set msvs_version' — newer npm rejects it.)

          cd "$VSCODE_DIR"
          # Install WITHOUT --ignore-scripts so native modules compile.
          # This will take ~3-5 minutes for node-gyp to compile C++ modules.
          npm install --no-save --no-package-lock 2>&1 | tail -30
          cd - > /dev/null

          # Verify native modules were compiled
          echo ""
          echo "=== Verifying native modules ==="

          SPDLOG_NODE=$(find "$VSCODE_DIR/node_modules/@vscode/spdlog" -name "spdlog.node" 2>/dev/null | head -1)
          if [ -n "$SPDLOG_NODE" ]; then
            echo "OK: spdlog.node found at $SPDLOG_NODE"
          else
            echo "WARNING: spdlog.node not found — code-server logging will be impaired"
          fi

          DEVICEID_NODE=$(find "$VSCODE_DIR/node_modules/@vscode/deviceid" -name "*.node" 2>/dev/null | head -1)
          if [ -n "$DEVICEID_NODE" ]; then
            echo "OK: deviceid native module found at $DEVICEID_NODE"
          else
            echo "WARNING: deviceid .node not found"
          fi

          REGISTRY_NODE=$(find "$VSCODE_DIR/node_modules/@vscode/windows-registry" -name "*.node" 2>/dev/null | head -1)
          if [ -n "$REGISTRY_NODE" ]; then
            echo "OK: windows-registry native module found at $REGISTRY_NODE"
          else
            echo "WARNING: windows-registry .node not found"
          fi

          # Verify @microsoft/1ds-core-js is available
          if [ -d "$VSCODE_DIR/node_modules/@microsoft/1ds-core-js" ]; then
            echo "OK: @microsoft/1ds-core-js installed successfully"
          else
            echo "WARNING: @microsoft/1ds-core-js not found"
          fi

          echo "code-server entry.js verified at: $ENTRY"
          echo ""

          # ── 3. Summary ──
          echo "=== Sidecar contents ==="
          find "$SIDECAR_DIR" -maxdepth 2 -type f | head -20
          echo "..."
          echo "Total sidecar size: $(du -sh "$SIDECAR_DIR" | cut -f1)"

      - name: Prune Windows Bundle (Optimization)
        shell: pwsh
        run: |
          .\.github\scripts\prune-windows.ps1

      - name: Ensure icons are valid RGBA
        shell: bash
        run: |
          # Install Pillow for icon generation from source jogicode.png
          pip install Pillow --quiet 2>&1 | tail -1 || true
          python3 src-tauri/scripts/make_icons.py
          for f in src-tauri/icons/*.png; do
            ct=$(python3 -c "
          import struct
          d=open('$f','rb').read()
          assert d[:8]==b'\x89PNG\r\n\x1a\n','not a PNG'
          print(struct.unpack('>IIBB', d[16:16+10])[3])
          ")
            if [ "$ct" != "6" ]; then
              echo "ERROR: $f has color_type=$ct (must be 6=RGBA)"
              exit 1
            fi
          done
          echo "All icons are valid RGBA."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --ignore-scripts

      - name: Build JogiCode (Tauri NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('JogiCode {0}', github.ref_name) || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/v') && format('JogiCode {0} — Lightweight Windows IDE powered by code-server.', github.ref_name) || '' }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: false
          args: --target ${{ env.WINDOWS_TARGET }}

      - name: Upload JogiCode installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JogiCode-windows-x64-installer
          path: |
            src-tauri/target/${{ env.WINDOWS_TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
