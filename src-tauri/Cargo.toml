[package]
name = "jogicode"
version = "1.0.5"
description = "JogiCode — Lightweight Windows IDE powered by code-server"
authors = ["JogiCode"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jogicode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
