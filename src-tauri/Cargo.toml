[package]
name = "jogicode"
version = "1.0.16"
description = "JogiCode — Lightweight Windows IDE powered by code-server"
authors = ["JogiCode"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jogicode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ════════════════════════════════════════════════════════════════════
# Release Profile — Aggressive memory & binary size optimization
# ════════════════════════════════════════════════════════════════════
# Targets: <600MB RAM ceiling, minimal binary size, zero runtime overhead.
[profile.release]
opt-level = "z"        # Optimize for size (aggressive memory minimization)
lto = true             # Link-Time Optimization — cross-crate inlining
codegen-units = 1      # Single compilation unit — best optimization
panic = "abort"        # Strip panic unwinding overhead (~200KB saved)
strip = true           # Remove all debug symbols
